# code-viz check (from code/course/viz/workflow.yml in Ursinus-Boilerplate-Code).
#
# It re-runs every labeled example (except recorded agent examples, which need Ollama and are
# recorded on minipc and committed) and fails when an example's output changed or an example
# stopped running, so a deck edit that breaks an example is caught. The viewer pages themselves
# are committed in viz/ and published by the course's normal Pages build.
name: code-viz check

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - "_pages/Activities/**.md"
      - "_pages/Tutorials/**.md"
      - "viz/manifest.json"

concurrency:
  group: code-viz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Re-run the examples and compare their outputs
        run: python3 code/course/viz/code-viz build --check
      - name: Show what changed
        if: failure()
        run: git status --short viz/ | head -50
