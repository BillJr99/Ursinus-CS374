plugins:
  - jekyll-relative-links
#  - jekyll-target-blank

relative_links:
  enabled: true
  collections: true

theme: jekyll-theme-slate

title: "CS374"
description: "Principles of Programming Languages"

url                      : https://BillJr99.github.io # the base hostname & protocol for your site e.g. "https://mmistakes.github.io"
baseurl                  : "/Ursinus-CS374-Fall2026" # the subpath of your site, e.g. "/blog"

# Where LiaScript decks are fetched from.
#
# Usable only in page BODIES ({{ site.activity_url }}liascript-types.md).
# Jekyll does not evaluate Liquid inside front matter, and the deck files
# themselves are not Jekyll-processed at all -- LiaScript fetches them straight
# from GitHub raw -- so links in those two places name the PARENT repository
# (BillJr99/Ursinus-CS374) on purpose: hardcoding a semester in a link is what
# these variables exist to avoid, and the parent is the semester-free target.
#
# These two lines and baseurl above are the only places a semester may appear.
activity_url             : "https://www.billmongan.com/LiaScript/?https://raw.githubusercontent.com/BillJr99/Ursinus-CS374-Fall2026/gh-pages/_pages/Activities/"
tutorial_url             : "https://www.billmongan.com/LiaScript/?https://raw.githubusercontent.com/BillJr99/Ursinus-CS374-Fall2026/gh-pages/_pages/Tutorials/"


# Reading Files
include:
  - .htaccess
  - _pages
  - files

